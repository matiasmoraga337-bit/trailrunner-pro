# TrailRunner Pro — entornos de desarrollo y produccion.
# Uso:
#   Desarrollo (hot reload):  docker compose up trailrunner-dev
#   IA local (Ollama):        docker compose up ollama
#   Todo junto:               docker compose up
#   Produccion:               docker compose up trailrunner
#   Build de prod:            docker compose build trailrunner

services:
  trailrunner-dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      # AI_PROVIDER: "ollama" o "gemini" (si no se configura, modo baseline)
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      # Ollama (IA local)
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      # Gemini (opcional, si AI_PROVIDER=gemini)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_FLASH: ${GEMINI_MODEL_FLASH:-gemini-2.0-flash-lite}
      GEMINI_MODEL_PRO: ${GEMINI_MODEL_PRO:-gemini-2.5-pro}
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  trailrunner:
    build:
      context: .
      target: prod
    ports:
      - "3001:3000"
    env_file:
      - .env.local
    restart: unless-stopped

volumes:
  ollama_data: